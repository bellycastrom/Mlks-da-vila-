name: Monitoramento de disponibilidade - Mlks da Vila

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/monitoramento-pages.yml"

permissions:
  contents: read

concurrency:
  group: monitoramento-pages
  cancel-in-progress: false

jobs:
  verificar-disponibilidade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar site publico e registrar status UP ou DOWN
        env:
          SITE_URL: https://bellycastrom.github.io/Mlks-da-vila-/
        run: |
          python - <<'PY'
          import datetime
          import os
          import sys
          import time
          import urllib.error
          import urllib.request

          url = os.environ["SITE_URL"]
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          up = False
          detail = ""
          http_code = "N/A"

          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "MlksDaVila-UptimeMonitor/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=25) as response:
                      http_code = str(response.status)
                      body = response.read(400_000).decode("utf-8", errors="replace")
                  if http_code == "200" and (
                      "Mlks da Vila" in body or "Mlks da Vila".lower() in body.lower()
                  ):
                      up = True
                      detail = "HTTP 200 e assinatura do MVP encontrada no HTML"
                      break
                  detail = f"HTTP {http_code}, HTML sem assinatura esperada"
              except urllib.error.HTTPError as exc:
                  http_code = str(exc.code)
                  detail = f"Resposta HTTP {exc.code}"
              except Exception as exc:
                  detail = f"{type(exc).__name__}: {exc}"
              print(f"Tentativa {attempt}: {detail}", flush=True)
              if attempt < 3:
                  time.sleep(5)

          state = "UP" if up else "DOWN"
          icon = "🟢" if up else "🔴"
          print(f"STATUS FINAL: {state} | HTTP: {http_code} | URL: {url}", flush=True)
          summary = (
              f"## {icon} Mlks da Vila — {state}\n\n"
              f"- **URL:** {url}\n"
              f"- **Verificação (UTC):** {now}\n"
              f"- **HTTP:** {http_code}\n"
              f"- **Diagnóstico:** {detail}\n"
              f"- **Execução:** {os.environ.get('GITHUB_RUN_ID', 'indisponível')}\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          if not up:
              sys.exit("DOWN: MVP indisponível ou conteúdo inesperado.")
          PY
