name: MVP - testes automatizados

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ferramenta de cobertura
        run: python -m pip install coverage
      - name: Executar testes e medir cobertura do backend
        run: |
          python -m coverage run --source=. --omit="*/tests/*,*/popular_exemplo.py" -m unittest discover -s tests -v
          python -m coverage report --include="*/app.py" -m
          python -m coverage json -o coverage.json
      - name: Arquivar relatorio de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: mlks-coverage
          path: coverage.json
          if-no-files-found: error
